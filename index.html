<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Budget Helper — Refined</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220" id="metaThemeColor">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" data-theme="light">
  <header class="topbar" id="topbar">
    <button class="hamburger" id="hambtn" aria-label="Open menu">☰</button>
    <div class="title" id="pagetitle">Summary</div>
    <div style="flex:1"></div>
    <div class="small muted" id="statusTime"></div>
  </header>

  <nav class="drawer" id="drawer" aria-hidden="true" role="navigation">
    <div class="drawer-header">
      <div class="logo">BH</div>
      <div class="brand">
        <div class="brand-title">Budget Helper</div>
        <div class="muted">Refined • iOS × Material</div>
      </div>
    </div>

    <ul class="nav-list" id="navList">
      <li><button class="navbtn" data-target="summary">Summary</button></li>
      <li><button class="navbtn" data-target="transactions">Transactions</button></li>
      <li><button class="navbtn" data-target="scheduled">Scheduled</button></li>
      <li><button class="navbtn" data-target="accounts">Accounts</button></li>
      <li><button class="navbtn" data-target="settings">Settings</button></li>
    </ul>

    <div class="drawer-footer">
      <div class="muted small">Theme</div>
      <div style="display:flex;gap:8px;align-items:center;margin:8px 0">
        <label class="switch">
          <input id="themeToggle" type="checkbox" aria-label="Toggle dark mode">
          <span class="switch-slider"></span>
        </label>
        <div class="muted">Dark</div>
      </div>
      <div class="muted small" style="margin-top:12px">Built with Apple HIG & Material 3 principles</div>
    </div>
  </nav>

  <main class="content" id="mainContent" role="main">
    <section id="summary" class="section-page active">
      <div class="hero card glass">
        <div class="left">
          <div class="small">Total Balance</div>
          <div class="balance" id="totalBalance">$0.00</div>
          <div class="muted" id="balanceBreakdown">No accounts yet</div>
        </div>
        <div class="right">
          <div class="stat small">Accounts <div class="stat-value" id="accountCount">0</div></div>
          <div class="stat small">Upcoming <div class="stat-value" id="upcomingCount">0</div></div>
        </div>
      </div>

      <div class="grid">
        <div class="card list-card">
          <div class="card-head"><div class="title-sm">Recent Transactions</div><div class="muted small">last 30 days</div></div>
          <div class="list" id="recentList"></div>
        </div>
        <div class="card insights-card glass-soft">
          <div class="title-sm">Insights</div>
          <div class="muted small">Monthly spend trends, saving goals — coming soon</div>
        </div>
      </div>
    </section>

    <section id="transactions" class="section-page">
      <div class="toolbar card glass-soft">
        <div class="controls">
          <select id="filterAccount"><option value="">All accounts</option></select>
          <div class="spacer"></div>
          <button id="btnNewTx" class="accent">New</button>
        </div>
      </div>
      <div class="list-wrap"><div class="list" id="transactionsList"></div></div>
    </section>

    <section id="scheduled" class="section-page">
      <div class="card card-head"><div class="title-sm">Scheduled Transactions</div><div><button id="newScheduled" class="accent">+ New</button></div></div>
      <div class="list" id="scheduledList"></div>
    </section>

    <section id="accounts" class="section-page">
      <div class="card card-head"><div class="title-sm">Accounts</div><div><button id="addAccount" class="accent">Add Account</button></div></div>
      <div class="list" id="accountsList"></div>
    </section>

    <section id="settings" class="section-page">
      <div class="card">
        <div class="title-sm">Display</div>
        <div class="display-settings">
          <label class="muted">Theme</label>
          <select id="themeSelect"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Follow system</option></select>
          <label class="muted">Status bar color</label>
          <input id="statusColor" type="color" value="#0b1220" />
        </div>
      </div>
      <div class="card">
        <div class="title-sm">Data</div>
        <div class="data-actions">
          <button id="exportBtn">Export JSON</button>
          <button id="importBtn">Import JSON</button>
          <input type="file" id="importFile" style="display:none" accept="application/json" />
        </div>
      </div>
    </section>
  </main>

  <button class="fab" id="fab" title="Add transaction">＋</button>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
</div>

<script src="script.min.js"></script>
</body>
</html>
